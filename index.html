<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi.ai Chromium Real Controller</title>
    <meta name="description" content="Real Chromium-powered automation and live remote browser interface interacting directly with the genuine Pi.ai page, DOM, and responses." />
    <meta name="pi-ai-dubbing-app" content="true" />
    <meta name="application-name" content="Pi AI Dubbing Studio" />
    <script>
      window.__PI_AI_DUBBING_APP__ = true;
      window.__PI_AI_DUBBING_SERVER__ = window.location.origin;
    </script>
    <meta property="og:title" content="Pi.ai Chromium Real Controller" />
    <meta property="og:description" content="Real Chromium-powered automation and live remote browser interface interacting directly with the genuine Pi.ai page, DOM, and responses." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #020617;
      }
      .init-header {
        border-bottom: 1px solid #1e293b;
        background: rgba(15, 23, 42, 0.8);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .init-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .init-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #10b981, #0f766e);
      }
      .init-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        border: 1px solid #334155;
        background: rgba(15, 23, 42, 0.6);
        color: #94a3b8;
      }
      .pulse-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #38bdf8;
        animation: init-pulse 1.5s infinite;
        margin-right: 6px;
      }
      @keyframes init-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body dir="rtl">
    <div id="root">
      <!-- Instant First-Paint Skeleton (No Blank White Page) -->
      <div id="initial-loader">
        <header class="init-header">
          <div class="init-brand">
            <div class="init-icon"></div>
            <div>
              <div style="font-weight: bold; font-size: 15px; color: #fff;">Pi.ai Chromium Controller</div>
              <div style="font-size: 11px; color: #94a3b8;">جلسة متصفح Chromium حقيقية تتصل بـ https://pi.ai وتتفاعل مع الـ DOM الفعلي</div>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <div class="init-badge">
              <span class="pulse-dot"></span>حالة المتصفح: جارٍ الاتصال...
            </div>
            <div class="init-badge">Pi.ai: Waiting...</div>
          </div>
        </header>
        <div style="padding: 24px; text-align: center; color: #64748b; font-size: 13px;">
          جارٍ تشغيل واجهة التحكم بالمتصفح...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
